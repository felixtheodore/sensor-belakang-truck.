<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rear-Truck Safety System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="p-3 mb-4 bg-primary text-white rounded shadow-sm">
        <h2 class="mb-1">🚛 Smart Rear-Truck Safety System</h2>
        <p class="mb-0">Simulasi Pemantauan Jarak Belakang Truk & Threshold Dinamis (MVP Web UI)</p>
    </div>

    <div class="row g-4">
        <!-- Panel Input -->
        <div class="col-md-5">
            <div class="card shadow-sm p-3">
                <h5 class="card-title mb-3">Input Simulasi</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold">Kecepatan Mundur (km/h):</label>
                    <input type="number" id="speed" class="form-control" value="8" step="0.1">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Jarak Objek Belakang (cm):</label>
                    <input type="number" id="distance" class="form-control" value="120" step="1">
                </div>
                <button onclick="runSimulation()" class="btn btn-primary w-100 fw-bold">Jalankan Simulasi</button>
            </div>
        </div>

        <!-- Panel Status -->
        <div class="col-md-7">
            <div class="card shadow-sm p-3">
                <h5 class="card-title mb-3">Status Monitoring Live</h5>
                <div class="text-center py-2 mb-3 bg-secondary text-white rounded h3 fw-bold" id="statusBox">-</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Ambang Bahaya Dinamis:</span>
                        <strong id="thresholdVal">- cm</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Indikator Buzzer:</span>
                        <strong id="buzzerVal">-</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Skor Keamanan Driver:</span>
                        <strong id="scoreVal">- / 100 (<span id="ratingVal">-</span>)</strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Panel Log -->
    <div class="card shadow-sm p-3 mt-4">
        <h5 class="card-title">Riwayat Log Kejadian</h5>
        <pre id="logOutput" class="bg-dark text-success p-3 rounded" style="max-height: 250px; overflow-y: auto;">Belum ada simulasi dijalankan...</pre>
    </div>
</div>

<script>
async function runSimulation() {
    const speed = document.getElementById('speed').value;
    const distance = document.getElementById('distance').value;

    try {
        const res = await fetch('/api/simulate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({speed, distance})
        });
        const data = await res.json();
        
        if(data.success) {
            const statusBox = document.getElementById('statusBox');
            statusBox.innerText = data.status;
            
            // Ubah warna box status sesuai level bahaya
            if(data.status === 'BAHAYA') {
                statusBox.className = 'text-center py-2 mb-3 bg-danger text-white rounded h3 fw-bold';
            } else if(data.status === 'WASPADA') {
                statusBox.className = 'text-center py-2 mb-3 bg-warning text-dark rounded h3 fw-bold';
            } else {
                statusBox.className = 'text-center py-2 mb-3 bg-success text-white rounded h3 fw-bold';
            }

            document.getElementById('thresholdVal').innerText = data.threshold + ' cm';
            document.getElementById('buzzerVal').innerText = data.buzzer;
            document.getElementById('scoreVal').innerText = data.report.safety_score + ' / 100';
            document.getElementById('ratingVal').innerText = data.report.driver_rating;
            
            const logsText = data.logs.map(l => l.formatted || JSON.stringify(l)).join('\n');
            document.getElementById('logOutput').innerText = logsText;
        }
    } catch(err) {
        alert('Gagal menjalankan simulasi: ' + err);
    }
}
</script>
</body>
</html>
